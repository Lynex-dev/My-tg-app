<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск в Telegram Mini App</title>
    <!-- Подключаем SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: var(--tg-theme-button-color, #007bff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .result-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

    <h2>Поиск</h2>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Введите запрос...">
        <button onclick="performSearch()">Найти</button>
    </div>

    <div id="results">
        <!-- Здесь будут появляться результаты -->
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран

        async function performSearch() {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('results');

            if (!query) {
                resultsDiv.innerHTML = '<p>Введите запрос для поиска</p>';
                return;
            }

            resultsDiv.innerHTML = '<p>Ищем...</p>';

            try {
                // --- ЭТОТ БЛОК ДЕЛАЕТ HTTP ЗАПРОС ---
                // Замените URL на адрес вашего реального сервера (бэкенда)
                // Пример: const response = await fetch(`https://api.вашсайт.com/search?q=${query}`);
                
                // Для теста мы используем фейковый запрос (симуляцию)
                const data = await mockFetch(query);

                // Очищаем результаты
                resultsDiv.innerHTML = '';

                // Выводим результаты на экран
                if (data.length === 0) {
                    resultsDiv.innerHTML = '<p>Ничего не найдено.</p>';
                } else {
                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = `<strong>${item.title}</strong><br>${item.description}`;
                        resultsDiv.appendChild(div);
                    });
                }

            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = '<p>Ошибка при поиске. Попробуйте позже.</p>';
            }
        }

        // --- ФЕЙКОВЫЙ СЕРВЕР ДЛЯ ТЕСТА (Удалите это в реальном проекте) ---
        function mockFetch(query) {
            return new Promise(resolve => {
                setTimeout(() => {
                    // База данных для теста
                    const db = [
                        { title: "Телефон iPhone 15", description: "Смартфон от Apple" },
                        { title: "Ноутбук MacBook", description: "Мощный ноутбук" },
                        { title: "Наушники AirPods", description: "Беспроводные наушники" },
                        { title: "Чехол для телефона", description: "Защита для iPhone" }
                    ];
                    // Фильтруем по запросу
                    const results = db.filter(item => item.title.toLowerCase().includes(query.toLowerCase()));
                    resolve(results);
                }, 500); // Задержка 0.5 сек
            });
        }
    </script>
</body>
</html>
